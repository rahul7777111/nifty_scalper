[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-scalper-bot"
version = "0.1.0"
description = "Nifty options scalper bot with m.Stock Type B API integration skeleton"
requires-python = ">=3.9"
dependencies = [
	"mStock-TradingApi-B>=1.0.0",
	"requests",
	"pyotp",
	"numpy>=1.23",
	"pandas>=1.5",
	"matplotlib",
	"plotly>=6.0",
	"scipy>=1.9",
	"scikit-learn>=1.1",
	"openpyxl>=3.1.0",
	"arch>=4.19",
	"statsmodels>=0.13",
	"cvxpy>=1.2",
	"pyportfolioopt>=1.5",
	"stable-baselines3>=1.8.0",
	"pytz>=2023.3",
	"python-dotenv>=1.0.0",
	"reportlab>=4.2.0",
	"streamlit>=1.58.0",
	"sv-ttk>=2.6.0",
	"yfinance>=0.2.0",
]

[project.optional-dependencies]
cli = []

[tool.nifty_scalper]
# Global configuration defaults can go here later

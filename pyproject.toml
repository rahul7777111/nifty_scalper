[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-scalper-bot"
version = "0.1.0"
description = "Nifty options scalper bot with m.Stock Type B API integration skeleton"
requires-python = ">=3.9"
dependencies = [
	"mStock-TradingApi-B>=1.0.0",
	"matplotlib",
	"pytz>=2023.3",
	"reportlab>=4.2.0",
	"sv-ttk>=2.6.0",
	"yfinance>=0.2.0",
]

[project.optional-dependencies]
cli = []

[tool.nifty_scalper]
# Global configuration defaults can go here later
